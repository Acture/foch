[package]
name = "foch-merge-quality"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Measures foch merge quality against evidence-qualified community compatch candidates."
publish = false

[features]
# Network + SteamCMD orchestration (discovery/fetch). Off by default so the
# scoring test and CI compile without reqwest's TLS stack. The committed mod
# corpus plus a local version-bound vanilla archive make scoring reproducible
# offline; the base-aware acceptance test is ignored in ordinary CI.
default = []
steam = ["dep:reqwest"]

[dependencies]
foch-engine = { path = "../foch-engine" }
foch-core = { path = "../foch-core" }
foch-language = { path = "../foch-language" }
blake3 = "1.5.5"
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
walkdir.workspace = true
tempfile.workspace = true
tar.workspace = true
flate2.workspace = true
time.workspace = true
zstd.workspace = true
reqwest = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2.186"
