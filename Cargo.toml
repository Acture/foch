[package]
name = "foch"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only AND GPL-3.0-only"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
description = "EU4 mod analysis and merge toolkit"
include = [
	"src/**",
	"Cargo.toml",
	"README.md",
	"LICENSE",
	"LICENSE-MERGIRAF.txt",
	"NOTICE.md",
]

[workspace]
resolver = "2"
members = [
	".",
	"apps/foch-cli",
	"apps/foch-desktop/src-tauri",
	"crates/foch-cwt",
	"crates/foch-engine",
	"crates/foch-language",
	"crates/foch-merge-kernel",
	"crates/foch-syntax",
	"packages/tree-sitter-paradox",
]
default-members = [".", "apps/foch-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
readme = "README.md"
homepage = "https://github.com/Acture/foch"
repository = "https://github.com/Acture/foch"
keywords = ["paradox", "eu4", "modding", "lsp", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
bincode = "1.3.3"
rkyv = "0.8"
clap = { version = "4.5.51", features = ["derive"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
console = "0.16.1"
dirs = "6.0.0"
encoding_rs = "0.8.35"
flate2 = "1.1.5"
globset = "0.4.16"
home = "0.5.12"
jomini = "0.29.0"
keyvalues-parser = "0.2.4"
regex = "1.12.2"
rayon = "1.11.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
remove_dir_all = "1.0.0"
rustix = { version = "1.1.4", features = ["fs"] }
same-file = "1.0.6"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.145"
semver = "1.0"
sha2 = "0.10.9"
steamlocate = "2.1.0"
tar = "0.4.44"
tempfile = "3.15.0"
time = { version = "0.3.47", features = ["formatting"] }
tiny_http = "0.12.0"
tokio = { version = "1.48.0", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
toml = "0.9.8"
tower-lsp = "0.20.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
walkdir = "2.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
winreg = "0.55.0"

[dependencies]
blake3 = "1.5.5"
chardetng = "1.0.0"
dirs.workspace = true
encoding_rs.workspace = true
globset.workspace = true
jomini.workspace = true
keyvalues-parser.workspace = true
regex.workspace = true
rkyv.workspace = true
rustix.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
steamlocate.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
test-utils = []
