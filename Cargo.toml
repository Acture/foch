[workspace]
resolver = "2"
members = [
	"src/packages/foch",
	"src/packages/foch-annotation",
	"src/packages/foch-lsp",
	"src/packages/foch-runner",
	"src/packages/foch-plugin-abi",
	"src/packages/foch-eu4-host",
	"src/packages/foch-test",
	"src/apps/foch-cli",
	"src/apps/foch-desktop/src-tauri",
	"src/packages/tree-sitter-paradox",
]
default-members = ["src/packages/foch", "src/packages/foch-annotation", "src/packages/foch-lsp", "src/packages/foch-runner", "src/packages/foch-test", "src/apps/foch-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
homepage = "https://github.com/Acture/foch"
repository = "https://github.com/Acture/foch"
keywords = ["paradox", "eu4", "modding", "lsp", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Published crates resolve these from the registry, so each path dependency
# pins exactly the version its path package declares.
foch = { path = "src/packages/foch", version = "=0.0.1" }
foch-annotation = { path = "src/packages/foch-annotation", version = "=0.0.1" }
foch-lsp = { path = "src/packages/foch-lsp", version = "=0.0.1" }
foch-runner = { path = "src/packages/foch-runner", version = "=0.0.1" }
foch-test = { path = "src/packages/foch-test", version = "=0.0.1" }
tree-sitter-paradox = { path = "src/packages/tree-sitter-paradox", version = "=0.3.0" }
bincode = "1.3.3"
chardetng = "1.0.0"
rkyv = "0.8"
clap = { version = "4.5.51", features = ["derive"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
console = "0.16.1"
dirs = "6.0.0"
encoding_rs = "0.8.35"
flate2 = "1.1.5"
globset = "0.4.16"
home = "0.5.12"
jomini = "0.29.0"
keyvalues-parser = "0.2.4"
regex = "1.12.2"
rayon = "1.11.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
remove_dir_all = "1.0.0"
rustix = { version = "1.1.4", features = ["fs"] }
same-file = "1.0.6"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.145"
semver = "1.0"
sha2 = "0.10.9"
steamlocate = "2.1.0"
tar = "0.4.44"
tempfile = "3.15.0"
time = { version = "0.3.47", features = ["formatting"] }
tiny_http = "0.12.0"
tokio = { version = "1.48.0", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
toml = "0.9.8"
tower-lsp = "0.20.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tree-sitter = "0.25"
walkdir = "2.5.0"
windows-sys = { version = "0.61.2", features = [
	"Win32_Foundation",
	"Win32_Storage_FileSystem",
	"Win32_System_ProcessStatus",
	"Win32_System_SystemInformation",
	"Win32_System_Threading",
] }
winreg = "0.55.0"
