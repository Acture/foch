[package]
name = "foch-plugin-read-decide"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
description = "Read-only EU4 territory decide: GNN suggestions over live state, no game writes"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
foch-plugin-sdk = "0.0.1"
foch-eu4-decide = { path = "../../src/packages/foch-eu4-decide" }
foch-eu4-gnn = { path = "../../src/packages/foch-eu4-gnn" }
foch-eu4-state = { path = "../../src/packages/foch-eu4-state" }
foch-runtime = { path = "../../src/packages/foch-runtime", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "3.15.0"

[[example]]
name = "terrain_smoke"
required-features = []
