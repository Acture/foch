[package]
name = "foch-plugin-directed-pacts"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "Target-specific EU4 pacts for the Foch native plugin host"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
foch-plugin-sdk = "0.0.1"
foch-runtime = { path = "../../src/packages/foch-runtime", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
foch-test = { path = "../../src/packages/foch-test" }
tempfile = "3.15.0"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
