[package]
name = "foch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only AND GPL-3.0-only AND MIT"
# The same page as foch-cli; cargo packages it as this crate's README.md.
readme = "../../apps/foch-cli/README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["development-tools", "game-development"]
description = "EU4 mod analysis and merge toolkit"
# What building the library reads: build.rs, `src/` (modules, `include_str!`
# data and in-source unit-test fixtures) and the vendored CWT rules build.rs
# compiles into the embedded rule pack. Integration tests, fuzz targets and the
# rest of the CWT checkout stay in the repository.
include = [
	"/build.rs",
	"/src/**",
	"/vendor/cwtools-eu4-config/**/*.cwt",
	"/vendor/cwtools-eu4-config/LICENSE",
	"/LICENSE",
	"/LICENSE-MERGIRAF.txt",
	"/NOTICE.md",
]

[dependencies]
bincode.workspace = true
blake3 = "1.5.5"
chardetng.workspace = true
console.workspace = true
dirs.workspace = true
encoding_rs.workspace = true
filetime = "0.2"
flate2.workspace = true
globset.workspace = true
jomini.workspace = true
keyvalues-parser.workspace = true
ref-cast = "1.0.27"
regex.workspace = true
relative-path = "2.0.1"
rkyv.workspace = true
rayon.workspace = true
remove_dir_all.workspace = true
reqwest.workspace = true
rustix.workspace = true
same-file.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
steamlocate.workspace = true
tempfile.workspace = true
toml.workspace = true
toml_edit = "0.23"
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-paradox.workspace = true
thiserror = "2.0"
typed-path = "0.12"
walkdir.workspace = true

# build.rs compiles the vendored CWT config with the `src/game/schema` modules
# it includes, so it needs exactly their dependencies.
[build-dependencies]
bincode.workspace = true
chardetng.workspace = true
encoding_rs.workspace = true
ref-cast = "1.0.27"
relative-path = "2.0.1"
rkyv.workspace = true
serde.workspace = true
sha2.workspace = true
tree-sitter.workspace = true
tree-sitter-paradox.workspace = true
walkdir.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
winreg.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.186"

[features]
test-utils = []
