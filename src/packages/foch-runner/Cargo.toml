[package]
name = "foch-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The same page as foch-cli; cargo packages it as this crate's README.md.
readme = "../../apps/foch-cli/README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["development-tools", "game-development"]
description = "Launches a real EU4 install in isolation to execute Foch test bundles"
# An internal library of the `foch` program, published because crates.io
# builds foch-cli from published crates only; its Rust API carries no semver
# promise. The crate is its sources and license texts.
include = [
	"/src/**",
	"/LICENSE",
	"/LICENSE-MERGIRAF.txt",
	"/NOTICE.md",
]

[dependencies]
foch.workspace = true
foch-test.workspace = true
serde.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
