[package]
name = "foch-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The same page as foch-cli; cargo packages it as this crate's README.md.
readme = "../../apps/foch-cli/README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["development-tools", "game-development"]
description = "Collection, planning, compilation and judging of in-game EU4 mod tests"
# An internal library of the `foch` program, published because crates.io
# builds foch-cli from published crates only; its Rust API carries no semver
# promise. The crate is its sources and license texts; integration tests and
# their fixtures stay in the repository.
include = [
	"/src/**",
	"/LICENSE",
	"/LICENSE-MERGIRAF.txt",
	"/NOTICE.md",
]

[dependencies]
foch.workspace = true
foch-annotation.workspace = true
jomini.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
