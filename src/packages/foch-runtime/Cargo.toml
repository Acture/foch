[package]
name = "foch-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Typed EU4 game services and the out-of-process Foch test runner"
readme = "../../apps/foch-cli/README.md"
# The published crate carries its sources and license texts only; the
# loader fixtures and tests stay in the repository.
include = [
	"/src/**",
	"/LICENSE",
	"/LICENSE-MERGIRAF.txt",
	"/NOTICE.md",
]

[lib]
crate-type = ["rlib"]

[features]
default = ["runner"]
# The out-of-process test runner drags the analysis crates; plugins
# consume the data plane alone with default-features = false.
runner = ["dep:foch", "dep:foch-test"]

[dependencies]
foch-plugin-sdk = { path = "../foch-plugin-sdk", version = "=0.0.1" }
foch = { workspace = true, optional = true }
foch-test = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
	"Win32_System_LibraryLoader",
	"Win32_System_Memory",
	"Win32_System_Diagnostics_Debug",
	"Win32_System_IO",
	"Win32_System_Ioctl",
	"Win32_System_ProcessStatus",
	"Win32_System_RemoteDesktop",
	"Win32_System_SystemInformation",
	"Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
