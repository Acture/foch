[package]
name = "foch-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Language server for EU4 mod scripts and Foch annotations, started by `foch lsp`"
# Linked into the `foch` binary; not a separate executable or published crate.
publish = false

[dependencies]
foch.workspace = true
foch-annotation.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-lsp.workspace = true
walkdir.workspace = true

[dev-dependencies]
blake3 = "1.5.5"
foch = { workspace = true, features = ["test-utils"] }
tempfile.workspace = true
