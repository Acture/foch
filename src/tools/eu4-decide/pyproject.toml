[project]
name = "foch-eu4-decide"
version = "0.1.0"
description = "Offline GRPO trainer for the EU4 decide policy"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gymnasium>=1.4.0",
    "sb3-contrib>=2.9.2",
    "stable-baselines3>=2.9.2",
    "torch>=2.5",
    "torch-geometric>=2.8.1",
    "transformers>=5.22.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.format]
indent-style = "tab"
