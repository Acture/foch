[package]
name = "foch-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "foch"
description = "EU4 mod analysis, merge and language server CLI"
# The binary and its feature-gated maintainer examples. Integration tests and
# the merge-quality corpus stay in the repository.
include = [
	"/src/**",
	"/examples/**",
	"/LICENSE",
	"/LICENSE-MERGIRAF.txt",
	"/NOTICE.md",
]

[dependencies]
clap.workspace = true
clap-verbosity-flag.workspace = true
dirs.workspace = true
foch.workspace = true
foch-annotation.workspace = true
foch-lsp.workspace = true
foch-runner.workspace = true
foch-test.workspace = true
crossterm = { version = "0.29.0", features = ["osc52"] }
ratatui = "0.30.0"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true
ctrlc = { version = "3.5.2", default-features = false, features = ["termination"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[dev-dependencies]
blake3 = "1.5.5"
sha2.workspace = true
dirs.workspace = true
foch = { workspace = true, features = ["test-utils"] }
keyvalues-parser.workspace = true
libc = "0.2.186"
regex.workspace = true
reqwest.workspace = true
tempfile.workspace = true
time.workspace = true
tiny_http.workspace = true
tower-lsp.workspace = true
toml.workspace = true

[features]
# Opt-in build flag for parser/semantic-index dev tools.
# `cargo install --path src/apps/foch-cli` (the default user path) installs only
# `foch`; pass `--features dev-tools` to build the `parse_stats` and
# `symbol_dump` examples, which are debugging utilities for parser and
# semantic-index maintainers (raw-directory inputs, ad-hoc arg parsing, no
# playset/config plumbing). Examples cannot pollute the user-facing
# `~/.cargo/bin/` namespace.
dev-tools = []

[[bin]]
name = "foch"
path = "src/main.rs"

[[example]]
name = "parse_stats"
path = "examples/parse_stats.rs"
required-features = ["dev-tools"]

[[example]]
name = "symbol_dump"
path = "examples/symbol_dump.rs"
required-features = ["dev-tools"]
