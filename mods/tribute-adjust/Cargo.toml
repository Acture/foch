[package]
name = "foch-eu4-tribute"
description = "Foch native plugin: scale each subject nation's tribute to its overlord by a configurable percentage (per subject kind, per tag)."
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
foch-plugin-sdk = { path = "../../src/packages/foch-plugin-sdk" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"

[dev-dependencies]
cc = "1"
serde_json = "1.0.145"
tempfile = "3.15.0"
