[package]
name = "foch-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
default-run = "foch"
description = "Paradox mod static analysis toolkit with CLI and EU4-focused language tooling"

[dependencies]
clap.workspace = true
clap-verbosity-flag.workspace = true
foch = { path = "../.." }
crossterm = "0.29.0"
ratatui = "0.30.0"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-lsp.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

[dev-dependencies]
blake3 = "1.5.5"
dirs.workspace = true
foch = { path = "../..", features = ["test-utils"] }
libc = "0.2.186"
regex.workspace = true
tempfile.workspace = true
time.workspace = true
tiny_http.workspace = true
toml.workspace = true

[features]
# Opt-in build flag for parser/semantic-index dev tools.
# `cargo install --path apps/foch-cli` (the default user path) installs only
# `foch`; pass `--features dev-tools` to build the `parse_stats` and
# `symbol_dump` examples, which are debugging utilities for parser and
# semantic-index maintainers (raw-directory inputs, ad-hoc arg parsing, no
# playset/config plumbing). Examples cannot pollute the user-facing
# `~/.cargo/bin/` namespace.
dev-tools = []

[[bin]]
name = "foch"
path = "src/main.rs"

[[example]]
name = "parse_stats"
path = "examples/parse_stats.rs"
required-features = ["dev-tools"]

[[example]]
name = "symbol_dump"
path = "examples/symbol_dump.rs"
required-features = ["dev-tools"]
