name: reusable-sync-homebrew-tap

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing release tag to sync into Homebrew tap"
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        description: "Token with write access to the Homebrew tap repository"
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to sync into Homebrew tap"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-tap-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  homebrew-tap:
    name: Update Homebrew tap from release asset
    if: ${{ vars.HOMEBREW_TAP_REPO != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require tap credential
        shell: bash
        env:
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          TAP_TOKEN_SET: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          if [ "$TAP_TOKEN_SET" != "true" ]; then
            echo "HOMEBREW_TAP_TOKEN must be a repository secret with write access to $TAP_REPO" >&2
            exit 1
          fi

      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Validate release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be v-prefixed SemVer, got: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          repo="${GITHUB_REPOSITORY}"
          url="https://github.com/${repo}/releases/download/${tag}/foch-${version}-source.tar.gz"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "repo=${repo}"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"

      - name: Download release source tarball
        shell: bash
        run: |
          curl -fsSL "${{ steps.meta.outputs.url }}" -o source.tar.gz
          sha256="$(sha256sum source.tar.gz | cut -d' ' -f1)"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
        id: archive

      - name: Checkout tap repository
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula
        shell: bash
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          VERSION: ${{ steps.meta.outputs.version }}
          URL: ${{ steps.meta.outputs.url }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
        run: ./scripts/render_homebrew_formula.sh "$REPO" "$VERSION" "$URL" "$SHA256" > "$RUNNER_TEMP/foch.rb"

      - name: Commit and push formula update
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/commit_homebrew_formula.sh tap "$RUNNER_TEMP/foch.rb" "$VERSION"
          git -C tap push
