name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package and release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout release refs
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release metadata
        id: meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be v-prefixed SemVer, got: $tag" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "release tag does not exist: $tag" >&2
            exit 1
          fi

          sha="$(git rev-list -n 1 "refs/tags/$tag")"
          version="${tag#v}"
          workspace_version="$(git show "$sha:Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["workspace"]["package"]["version"])')"
          if [ "$version" != "$workspace_version" ]; then
            echo "tag version $version does not match workspace version $workspace_version" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ] && [ "$sha" != "$GITHUB_SHA" ]; then
            echo "tag $tag resolves to $sha, expected pushed SHA $GITHUB_SHA" >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  build-cli-assets:
    name: Build CLI assets (${{ matrix.target }})
    needs: release-metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            archive_ext: tar.gz
          - runner: windows-latest
            target: win32-x64
            archive_ext: zip
          - runner: macos-14
            target: darwin-arm64
            archive_ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-metadata.outputs.sha }}
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release binaries
        run: cargo build --release --locked --bin foch

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/bin
          cp target/release/foch dist/bin/
          tar -C dist/bin -czf "dist/foch-${{ needs.release-metadata.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}" foch

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force dist/bin | Out-Null
          Copy-Item target/release/foch.exe dist/bin/
          Compress-Archive -Path dist/bin/* -DestinationPath "dist/foch-${{ needs.release-metadata.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}" -Force

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  package-vsix:
    name: Package VSIX (${{ matrix.target }})
    needs: release-metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: windows-latest
            target: win32-x64
          - runner: macos-14
            target: darwin-arm64
    defaults:
      run:
        working-directory: packages/vscode-foch
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-metadata.outputs.sha }}
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-downloads-${{ steps.setup-bun.outputs.bun-version }}-v1-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-downloads-${{ steps.setup-bun.outputs.bun-version }}-v1-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Package VSIX
        run: bun run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-${{ matrix.target }}
          path: packages/vscode-foch/*.vsix

  build-source-archive:
    name: Build source archive
    needs: release-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-metadata.outputs.sha }}
          submodules: recursive

      - name: Create source tarball
        shell: bash
        run: |
          version="${{ needs.release-metadata.outputs.version }}"
          root="foch-${version}"
          mkdir -p dist stage/"${root}"
          rsync -a \
            --exclude='.git' \
            --exclude='.direnv' \
            --exclude='target' \
            --exclude='node_modules' \
            ./ stage/"${root}"/
          tar -C stage -czf "dist/${root}-source.tar.gz" "${root}"

      - name: Upload source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive
          path: dist/*

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - release-metadata
      - build-cli-assets
      - package-vsix
      - build-source-archive
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          version="$RELEASE_VERSION"
          extra_args=()
          if [[ "${tag}" == *-* ]]; then
            extra_args+=(--prerelease)
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --clobber
          else
            gh release create "${tag}" dist/* \
              --title "Foch ${version}" \
              --generate-notes \
              --verify-tag \
              "${extra_args[@]}"
          fi

  homebrew-tap:
    name: Update Homebrew tap
    needs:
      - release-metadata
      - github-release
      - build-source-archive
    uses: ./.github/workflows/sync-homebrew-tap.yml
    with:
      tag: ${{ needs.release-metadata.outputs.tag }}
    secrets: inherit
