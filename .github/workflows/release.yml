# Release one tag to every channel from one source.
#
# The preflight refuses a tag any channel would reject or misplace before
# anything is built. dist.yml builds and verifies the wheels and archives; the
# GitHub release carries them with the VSIX, the source archive, the WinGet
# manifests rendered from the Windows archive and SHA256SUMS.txt. Pushing the
# tag publishes the GitHub release and, once the tap token exists, updates the
# Homebrew tap. crates.io and PyPI publish only where the maintainer enabled
# them (CRATES_IO_PUBLISH and PYPI_PUBLISH repository variables) and approves
# their environment. WinGet is verified against the published manifests here,
# but submitted to winget-pkgs by the maintainer. Trusted Publishing requires
# the publish jobs to stay in this top-level workflow.
#
# Re-running a partially published release: use "Re-run failed jobs". The
# preflight refuses a published release that already has assets, so "Re-run
# all jobs" fails by design once the release is out. A draft left by an
# interrupted upload passes the preflight; github-release then keeps its
# identical assets, adds the missing ones, fails if an existing asset differs,
# and publishes it.
name: release

on:
  push:
    tags:
      - "v*"
  # Re-release an existing tag by dispatching on that tag:
  # gh workflow run release.yml --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      pep440: ${{ steps.meta.outputs.pep440 }}
      release-date: ${{ steps.meta.outputs.release-date }}
      source-date-epoch: ${{ steps.meta.outputs.source-date-epoch }}
    steps:
      - name: Require Homebrew tap credential
        if: ${{ vars.HOMEBREW_TAP_REPO != '' }}
        shell: bash
        env:
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          TAP_TOKEN_SET: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          if [ "$TAP_TOKEN_SET" != "true" ]; then
            echo "HOMEBREW_TAP_TOKEN must be a repository secret with write access to $TAP_REPO before publishing" >&2
            exit 1
          fi

      - name: Checkout release refs
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install uv==0.12.17

      - name: Validate release metadata
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Every job builds github.sha, so the run must be on the tag itself.
          if [ "$REF_TYPE" != "tag" ]; then
            echo "run release.yml on a tag ref (gh workflow run release.yml --ref vX.Y.Z), not $REF_TYPE $REQUESTED_TAG" >&2
            exit 1
          fi
          tag="$REQUESTED_TAG"
          sha="$(git rev-list -n 1 "refs/tags/$tag")"
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "tag $tag resolves to $sha, but this run checked out $GITHUB_SHA" >&2
            exit 1
          fi

          # The tag's own rules: vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N naming the
          # workspace version, never build metadata; also its PyPI spelling.
          metadata="$(uv run --locked --no-dev --project src/tools/foch-dev python -m foch_dev version --tag "$tag")"
          # The commit time dates the release reproducibly on every re-run.
          epoch="$(git log -1 --format=%ct "$sha")"
          release_date="$(date -u -d "@$epoch" +%F)"
          {
            echo "$metadata"
            echo "release-date=$release_date"
            echo "source-date-epoch=$epoch"
          } | tee -a "$GITHUB_OUTPUT"

  preflight:
    name: Release preflight
    needs: release-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Initialize public build submodules
        run: git submodule update --init --recursive src/packages/tree-sitter-paradox src/packages/foch/vendor/cwtools-eu4-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install uv==0.12.17

      # Read-only: crates.io, PyPI, winget-pkgs and this repository's release.
      - name: Check every channel
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --no-dev --project src/tools/foch-dev python -m foch_dev release preflight --tag "$RELEASE_TAG"

  dist:
    name: Build binaries
    needs: [release-metadata, preflight]
    uses: ./.github/workflows/dist.yml
    with:
      version: ${{ needs.release-metadata.outputs.version }}

  package-vsix:
    name: Package VSIX (${{ matrix.target }})
    needs: [release-metadata, preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: windows-latest
            target: win32-x64
          - runner: macos-15
            target: darwin-arm64
    defaults:
      run:
        working-directory: src/apps/vscode-foch
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Initialize public build submodules
        working-directory: ${{ github.workspace }}
        run: git submodule update --init --recursive src/packages/tree-sitter-paradox src/packages/foch/vendor/cwtools-eu4-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Package VSIX
        run: bun run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-${{ matrix.target }}
          path: src/apps/vscode-foch/*.vsix
          if-no-files-found: error

  build-source-archive:
    name: Build source archive
    needs: [release-metadata, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Initialize public build submodules
        working-directory: ${{ github.workspace }}
        run: git submodule update --init --recursive src/packages/tree-sitter-paradox src/packages/foch/vendor/cwtools-eu4-config

      - name: Create source tarball
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: ./scripts/build_source_archive.sh "$VERSION" dist

      - name: Upload source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - release-metadata
      - dist
      - package-vsix
      - build-source-archive
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
      RELEASE_DATE: ${{ needs.release-metadata.outputs.release-date }}
      SOURCE_DATE_EPOCH: ${{ needs.release-metadata.outputs.source-date-epoch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install uv==0.12.17

      - name: Download CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download VSIX packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true

      - name: Download the source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-archive
          path: dist

      - name: Render the WinGet manifests
        shell: bash
        run: |
          set -euo pipefail
          foch_dev=(uv run --locked --no-dev --project src/tools/foch-dev python -m foch_dev)
          out="$RUNNER_TEMP/winget"
          manifests="$("${foch_dev[@]}" winget render \
            --asset "dist/foch-$RELEASE_VERSION-win32-x64.zip" \
            --version "$RELEASE_VERSION" --release-date "$RELEASE_DATE" --out "$out")"
          "${foch_dev[@]}" winget check --release "$manifests"
          # Byte-stable across re-runs: fixed mtimes, sorted entries, no extra fields.
          archive="$GITHUB_WORKSPACE/dist/foch-$RELEASE_VERSION-winget-manifests.zip"
          cd "$out"
          find manifests -type f -exec touch -d "@$SOURCE_DATE_EPOCH" {} +
          find manifests -type f | LC_ALL=C sort | TZ=UTC zip -X -D -q "$archive" -@
          unzip -l "$archive"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Channels hash these assets, so an existing one is never replaced. Only
      # this step holds the write token.
      - name: Create or complete the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            extra_args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              extra_args+=(--prerelease)
            fi
            # A release establishes installation only; the status page at the
            # tag states whether merge quality passed product acceptance.
            blob="https://github.com/$GH_REPO/blob/$RELEASE_TAG"
            notes="Foch is an EU4-only alpha. Installing it does not make it ready to merge: the first run needs an EU4 base-data snapshot built from your own game installation (\`foch data build eu4 --from-game-path <EU4> --game-version auto --install\`). Whether merge quality has passed product acceptance at this release is recorded in [the project status]($blob/docs/project-status.md#product-acceptance); see [the current boundary]($blob/README.md#current-boundary) before merging a playset."
            gh release create "$RELEASE_TAG" dist/* \
              --title "Foch $RELEASE_VERSION" \
              --notes "$notes" \
              --generate-notes \
              --verify-tag \
              "${extra_args[@]}"
            exit 0
          fi

          mapfile -t published < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for name in "${published[@]}"; do
            # Base data the maintainer may add with scripts/upload_release_data_assets.sh;
            # no channel hashes it.
            case "$name" in
              foch-data-manifest.json | foch-*-base-snapshot-*.bin) continue ;;
            esac
            if [ ! -f "dist/$name" ]; then
              echo "release $RELEASE_TAG has an asset this run did not build: $name" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/published"
          for file in dist/*; do
            name="$(basename "$file")"
            if printf '%s\n' "${published[@]}" | grep -Fxq -- "$name"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$RUNNER_TEMP/published"
              if ! cmp "$file" "$RUNNER_TEMP/published/$name"; then
                echo "published $name differs from this run's; refusing to replace it" >&2
                exit 1
              fi
              echo "kept identical $name"
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi

  publish-crates:
    name: Publish to crates.io
    needs: [release-metadata, github-release]
    if: vars.CRATES_IO_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: crates-io
      url: https://crates.io/crates/foch-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Initialize public build submodules
        run: git submodule update --init --recursive src/packages/tree-sitter-paradox src/packages/foch/vendor/cwtools-eu4-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Multi-package publishing is not atomic, so a re-run selects only the
      # crates crates.io lacks. The grammar resolves from crates.io, where the
      # preflight found its pinned release. An exact `vers` match suffices: the
      # preflight refused any crates.io variant of the version, and cargo
      # refuses to publish a version that exists.
      - name: Publish foch and foch-cli
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          selected=()
          for crate in foch foch-cli; do
            if curl -fsSL "https://index.crates.io/fo/ch/$crate" \
              | jq -e --arg version "$RELEASE_VERSION" 'select(.vers == $version)' >/dev/null; then
              echo "crates.io already has $crate $RELEASE_VERSION"
            else
              selected+=(-p "$crate")
            fi
          done
          if [ "${#selected[@]}" -eq 0 ]; then
            exit 0
          fi
          cargo publish --locked "${selected[@]}"

  publish-pypi:
    name: Publish to PyPI
    needs: [release-metadata, github-release]
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/foch/${{ needs.release-metadata.outputs.pep440 }}/
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      # dist.yml verified each target's one wheel against its platform tags and
      # the release's PEP 440 version.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  winget-release-verify:
    name: Verify the WinGet release manifests
    needs: [release-metadata, dist, github-release]
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
      CWT_SCHEMA_ID: ${{ needs.dist.outputs.cwt-schema-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install uv==0.12.17

      - name: Download the published manifests
        shell: pwsh
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir release-asset `
            --pattern "foch-$env:RELEASE_VERSION-winget-manifests.zip"
          if ($LASTEXITCODE -ne 0) { throw 'gh release download failed' }

      # The attached set is the one to submit to microsoft/winget-pkgs; this job
      # never submits. WinGet downloads the published archive from its https
      # URL and checks those bytes against the hash the manifests name.
      - name: Install and uninstall from the release manifests
        shell: pwsh
        run: |
          $fochDev = 'uv run --locked --no-dev --project src/tools/foch-dev python -m foch_dev'
          ./src/apps/foch-cli/scripts/smoke_winget.ps1 -Mode release `
            -ManifestArchive "release-asset/foch-$env:RELEASE_VERSION-winget-manifests.zip" `
            -Version $env:RELEASE_VERSION -ExpectedCwtSchemaId $env:CWT_SCHEMA_ID -FochDev $fochDev

      - name: Upload WinGet logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-release-logs
          path: ${{ runner.temp }}/foch-winget-smoke/logs
          if-no-files-found: ignore

  homebrew-tap:
    name: Update Homebrew tap
    needs:
      - release-metadata
      - github-release
      - build-source-archive
    uses: ./.github/workflows/sync-homebrew-tap.yml
    with:
      tag: ${{ needs.release-metadata.outputs.tag }}
    secrets: inherit
