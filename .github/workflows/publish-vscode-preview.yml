name: publish-vscode-preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: publish-vscode-preview-${{ inputs.ref != '' && inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  publish-preview:
    name: Publish VS Code preview (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: windows-latest
            target: win32-x64
          - runner: macos-14
            target: darwin-arm64
    defaults:
      run:
        working-directory: packages/vscode-foch
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Run extension release smoke
        run: bun run test

      - name: Publish pre-release extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bun run publish:pre-release
