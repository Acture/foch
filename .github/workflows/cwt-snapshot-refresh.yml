name: CWT snapshot refresh

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cwt-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          # Later steps build and test third-party schema changes; only the
          # pull request step authenticates.
          persist-credentials: false

      - name: Initialize public build submodules
        working-directory: ${{ github.workspace }}
        run: git submodule update --init --recursive src/packages/tree-sitter-paradox src/packages/foch/vendor/cwtools-eu4-config

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install uv==0.12.17

      - name: Capture current schema state
        id: before
        run: |
          set -euo pipefail
          echo "submodule_sha=$(git -C src/packages/foch/vendor/cwtools-eu4-config rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "schema_hash=$(uv run --locked --no-dev --project src/tools/foch-dev python -m foch_dev schema-hash)" >> "$GITHUB_OUTPUT"

      - name: Refresh vendored schema
        id: refresh
        env:
          BEFORE_SHA: ${{ steps.before.outputs.submodule_sha }}
        run: |
          set -euo pipefail
          git submodule update --remote --merge src/packages/foch/vendor/cwtools-eu4-config

          before_sha="$BEFORE_SHA"
          after_sha="$(git -C src/packages/foch/vendor/cwtools-eu4-config rev-parse HEAD)"
          after_hash="$(uv run --locked --no-dev --project src/tools/foch-dev python -m foch_dev schema-hash)"
          short_sha="${after_sha:0:12}"
          changed=false

          if [ "$before_sha" != "$after_sha" ]; then
            changed=true
          fi

          {
            echo "changed=$changed"
            echo "submodule_sha=$after_sha"
            echo "short_sha=$short_sha"
            echo "schema_hash=$after_hash"
            echo 'commit_log<<EOF'
            if [ "$changed" = true ]; then
              git -C src/packages/foch/vendor/cwtools-eu4-config --no-pager log --oneline "${before_sha}..${after_sha}"
            else
              echo "No upstream changes."
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        if: steps.refresh.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Cache Rust
        if: steps.refresh.outputs.changed == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Tauri Linux dependencies
        if: steps.refresh.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Verify GitHub CLI auth
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth status

      - name: Run workspace tests
        if: steps.refresh.outputs.changed == 'true'
        run: cargo test --workspace --quiet

      # Upstream commit subjects arrive through env, never as script text, and
      # a parameter expansion's result is not expanded again.
      - name: Create refresh pull request
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ steps.before.outputs.submodule_sha }}
          BEFORE_HASH: ${{ steps.before.outputs.schema_hash }}
          AFTER_SHA: ${{ steps.refresh.outputs.submodule_sha }}
          AFTER_HASH: ${{ steps.refresh.outputs.schema_hash }}
          SHORT_SHA: ${{ steps.refresh.outputs.short_sha }}
          COMMIT_LOG: ${{ steps.refresh.outputs.commit_log }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="automation/cwt-snapshot-refresh-${SHORT_SHA}"
          title="chore(schema): bump cwtools-eu4-config to ${SHORT_SHA}"
          created=false

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add .gitmodules src/packages/foch/vendor/cwtools-eu4-config

          if git diff --cached --quiet; then
            echo "No tracked changes to commit."
            exit 0
          fi

          git commit -m "$title"
          gh auth setup-git
          git push --force-with-lease origin "HEAD:$branch"

          pr_url="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // ""')"
          if [ -z "$pr_url" ]; then
            created=true
            pr_url="$(gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "$title" \
              --body-file - <<EOF
          ## Summary

          - Update \`src/packages/foch/vendor/cwtools-eu4-config\` from \`${BEFORE_SHA}\` to \`${AFTER_SHA}\`
          - Refresh schema pack identity from \`${BEFORE_HASH}\` to \`${AFTER_HASH}\`
          - Re-run \`cargo test --workspace --quiet\` before opening this PR

          ## Upstream commit log

          \`\`\`
          ${COMMIT_LOG}
          \`\`\`

          ⚠️ Any baseline diff is a fixture failure and requires human review.

          ⚠️ The build embeds this schema, and its identity is part of \`analysis_rules_version\`: merging invalidates every installed base snapshot and persistent mod snapshot, so release base-data assets must be rebuilt with the new binary.
          EOF
          )"
          fi

          if [ "$created" = true ]; then
            gh pr comment "$pr_url" --body "⚠️ Any baseline diff is a fixture failure and requires human review."
          fi
