name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Test release scripts
        run: python3 scripts/test_render_homebrew_formula.py

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Verify Cargo binary surface
        run: python3 scripts/check_cargo_binary_targets.py

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-test:
    name: Rust test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Cargo test
        run: cargo test --locked --workspace

  tree-sitter-smoke:
    name: Tree-sitter smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/tree-sitter-paradox
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-downloads-${{ steps.setup-bun.outputs.bun-version }}-v1-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-downloads-${{ steps.setup-bun.outputs.bun-version }}-v1-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      # Generated artifacts (src/grammar.json, src/node-types.json,
      # src/parser.c, src/tree_sitter/*) drift between tree-sitter-cli
      # versions even without grammar.js changes, so a strict
      # `git diff --exit-code src/` produces false positives. Re-add this
      # guard once the committed src/ is regenerated against the cli
      # version pinned by bun.lock (must be done on Linux/macOS/WSL).
      # - name: Verify generated parser is up to date
      #   run: |
      #     bunx tree-sitter generate
      #     git diff --exit-code src/grammar.json

      - name: Test grammar package
        run: bun run test

  vscode-smoke:
    name: VS Code smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/vscode-foch
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-downloads-${{ steps.setup-bun.outputs.bun-version }}-v1-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-downloads-${{ steps.setup-bun.outputs.bun-version }}-v1-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Smoke test extension
        run: bun run test

  desktop-smoke:
    name: Desktop smoke (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check desktop frontend
        run: |
          bun run --cwd apps/foch-desktop format:check
          bun run --cwd apps/foch-desktop lint
          bun run --cwd apps/foch-desktop typecheck
          bun run --cwd apps/foch-desktop test
          bun run --cwd apps/foch-desktop build

      - name: Test desktop backend
        run: cargo test --locked -p foch-desktop

      - name: Build NSIS development installer
        run: bun run --cwd apps/foch-desktop tauri build --bundles nsis

      - name: Launch desktop executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "target/release/foch-desktop.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "foch-desktop exited during launch smoke with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id

      - name: Upload NSIS development installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foch-desktop-windows-x64-development
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  ci-required:
    name: CI required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions: {}
    needs:
      - workflow-lint
      - rust-quality
      - rust-test
      - desktop-smoke
      - tree-sitter-smoke
      - vscode-smoke
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          for result in \
            "${{ needs.workflow-lint.result }}" \
            "${{ needs.rust-quality.result }}" \
            "${{ needs.rust-test.result }}" \
            "${{ needs.desktop-smoke.result }}" \
            "${{ needs.tree-sitter-smoke.result }}" \
            "${{ needs.vscode-smoke.result }}"; do
            if [ "${result}" != "success" ]; then
              echo "Required CI job result: ${result}"
              exit 1
            fi
          done
